[workspace]
members = ["gen9"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
rust-version = "1.88"
license = "MIT"
publish = false

[package]
name = "teamgen"
description = "Gen 9 Random Battles: the team generator's party-slot weights computed exactly, and its parity with Pokémon Showdown"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
autobins = false

[[bin]]
name = "exact_team_weights"
path = "src/main.rs"

[[bin]]
name = "parity"
path = "src/bin/parity.rs"

# The staged files, rendered from the weights.
[[bin]]
name = "slots"
path = "src/bin/slots/main.rs"

[features]
# Slot 5's class sums and slot 6's node loop on the GPU (`cuda/`), built by nvcc; see build.rs.
gpu = []

[dependencies]
indicatif = "0.18.6"
mimalloc = "0.1.52"
randbats-gen9 = { path = "gen9" }
rand = "0.10"
serde = { version = "1", features = ["derive"] }
# Correctly rounded float parsing: without it the rendered files move by ulps.
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }

[build-dependencies]
cc = "1.5.1"

[profile.release]
lto = "fat"
codegen-units = 1
